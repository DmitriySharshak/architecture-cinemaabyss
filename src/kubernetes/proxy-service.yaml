apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: cinemaabyss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      containers:
        - name: proxy-service
          image: ghcr.io/mayflowwer/architecture-cinemaabyss/proxy-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
          imagePullPolicy: Always
      imagePullSecrets:
        - name: dockerconfigjson
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: cinemaabyss
spec:
  type: NodePort
  selector:
    app: proxy-service
  ports:
    - port: 8000
      targetPort: 8000
