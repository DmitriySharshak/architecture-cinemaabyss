apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: cinemaabyss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: events-service
  template:
    metadata:
      labels:
        app: events-service
    spec:
      containers:
        - name: events-service
          image: ghcr.io/mayflowwer/architecture-cinemaabyss/events-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
          imagePullPolicy: Always
      imagePullSecrets:
        - name: dockerconfigjson
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: cinemaabyss
spec:
  type: NodePort
  selector:
    app: events-service
  ports:
    - port: 8082
      targetPort: 8082
